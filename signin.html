
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Explore World</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card signin-card">

        <div class="brand">
            <span>✈</span> Explore World
        </div>

        <h2>Welcome Back!</h2>
        <p class="subtitle">Sign in to continue your journey.</p>

        <form id="signinForm" novalidate>

            <div class="mb-4">
                <label for="loginEmail" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="loginEmail"
                    placeholder="Enter your registered email" required>
                <small class="error" id="loginEmailError"></small>
            </div>

            <div class="mb-4">
                <label for="loginPassword" class="form-label">Password</label>
                <div class="password-box">
                    <input type="password" class="form-control" id="loginPassword"
                        placeholder="Enter your password" required>
                    <button type="button" class="toggle-btn"
                        data-target="loginPassword" aria-label="Show password">Show</button>
                </div>
                <small class="error" id="loginPasswordError"></small>
            </div>

            <div id="signinMessage" class="message" role="status"></div>

            <button type="submit" class="btn auth-btn w-100">
                Sign In
            </button>

        </form>

        <p class="redirect-text">
            Don't have an account?
            <a href="index.html">Create Account</a>
        </p>

    </div>
</div>

<script src="JAVASCRIPT/script.js"></script>
</body>
</html>
