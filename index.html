
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Explore World</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card signup-card">

        <div class="brand">
            <span>✈</span> Explore World
        </div>

        <h2>Create Account</h2>
        <p class="subtitle">Start your journey with us!</p>

        <form id="signupForm" novalidate>

            <div class="mb-3">
                <label for="fullname" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="fullname"
                    placeholder="Enter your full name" required>
                <small class="error" id="nameError"></small>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email"
                    placeholder="example@mail.com" required>
                <small class="error" id="emailError"></small>
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" class="form-control" id="phone"
                    placeholder="10 digit phone number" maxlength="10" required>
                <small class="error" id="phoneError"></small>
            </div>

            <div class="mb-3">
                <label for="city" class="form-label">Location / City</label>
                <input type="text" class="form-control" id="city"
                    placeholder="Enter your city" required>
                <small class="error" id="cityError"></small>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="password-box">
                    <input type="password" class="form-control" id="password"
                        placeholder="Minimum 8 characters" required>
                    <button type="button" class="toggle-btn"
                        data-target="password" aria-label="Show password">Show</button>
                </div>
                <small class="error" id="passwordError"></small>
                <small class="hint">Must contain at least 8 characters, letters and numbers.</small>
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <div class="password-box">
                    <input type="password" class="form-control" id="confirmPassword"
                        placeholder="Re-enter your password" required>
                    <button type="button" class="toggle-btn"
                        data-target="confirmPassword" aria-label="Show password">Show</button>
                </div>
                <small class="error" id="confirmError"></small>
            </div>

            <div id="signupMessage" class="message" role="status"></div>

            <button type="submit" class="btn auth-btn w-100">
                Create Account
            </button>

        </form>

        <p class="redirect-text">
            Already have an account?
            <a href="signin.html">Sign In</a>
        </p>

    </div>
</div>

<script src="JAVASCRIPT/script.js"></script>
</body>
</html>
